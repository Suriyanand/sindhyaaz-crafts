services:
  - type: web
    name: sindhyaaz-crafts
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_PATH
        value: ./server/database/gift_shop.db
      - key: UPLOAD_DIR
        value: ./server/uploads
