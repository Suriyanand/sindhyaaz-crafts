services:
  - type: web
    name: sindhyaaz-crafts
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_PATH
        value: /var/data/gift_shop.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: data-disk
      mountPath: /var/data
      sizeGB: 1
