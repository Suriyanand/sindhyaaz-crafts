services:
  - type: web
    name: sindhyaaz-crafts
    env: node
    plan: free
    nodeVersion: 20.11.0
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_PATH
        value: ./server/database/gift_shop.db
      - key: UPLOAD_DIR
        value: ./server/uploads
